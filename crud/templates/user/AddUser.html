{% extends "layout/base.html" %}

{% block 'title' %} Add User Page {% endblock 'title' %}

{% block 'content' %}
{% include 'include/Sidebar.html' %}
{% include 'include/Toastmessage.html' %} 

<div class="w-full px-4 md:px-8 py-6"> 
    <div class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        
        <div class="px-6 py-4 border-b border-slate-100">
            <h2 class="text-lg font-bold text-slate-800">Add User</h2>
        </div>

        <div class="p-6">
            <form action="/user/add" method="post" class="space-y-6">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
                    
                    <div class="space-y-1">
                        <label for="full_name" class="text-sm font-semibold text-slate-800 ml-1">Full Name</label>
                        <input type="text" placeholder="Enter Full Name" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-300 rounded-lg text-sm outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400" name="full_name" id="full_name" />
                    </div>

                    <div class="space-y-1">
                        <label for="email" class="text-sm font-semibold text-slate-800 ml-1">Email</label>
                        <input type="email" placeholder="Enter Email" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-300 rounded-lg text-sm outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400" name="email" id="email" />
                    </div>

                    <div class="space-y-1">
                        <label for="gender" class="text-sm font-semibold text-slate-800 ml-1">Gender</label>
                        <select name="gender" id="gender" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-300 rounded-lg text-sm outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400"> 
                            <option value="">Select Gender</option>
                            {% for gender in genders %}
                                <option value="{{ gender.gender_id }}">{{ gender.gender }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label for="username" class="text-sm font-semibold text-slate-800 ml-1">Username</label>
                        <input type="text" placeholder="Enter Username" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-300 rounded-lg text-sm outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400" name="username" id="username" />
                    </div>

                    <div class="space-y-1">
                        <label for="birth_date" class="text-sm font-semibold text-slate-800 ml-1">Birth Date</label>
                        <input type="date" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-300 rounded-lg text-sm outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400" name="birth_date" id="birth_date" />
                    </div>

                    <div class="space-y-1">
                        <label for="password" class="text-sm font-semibold text-slate-800 ml-1">Password</label>
                        <input type="password" placeholder="Enter Password" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-300 rounded-lg text-sm outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400" name="password" id="password" />
                    </div>

                    <div class="space-y-1">
                        <label for="address" class="text-sm font-semibold text-slate-800 ml-1">Address</label>
                        <textarea placeholder="Enter Address" rows="3" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-300 rounded-lg text-sm outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400 resize-none" name="address" id="address"></textarea>
                    </div>

                    <div class="space-y-1">
                        <label for="confirm_password" class="text-sm font-semibold text-slate-800 ml-1">Confirm Password</label>
                        <input type="password" placeholder="Re-enter Password" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-300 rounded-lg text-sm outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400" name="confirm_password" id="confirm_password" />
                    </div>

                    <div class="space-y-1">
                        <label for="contact_number" class="text-sm font-semibold text-slate-800 ml-1">Contact Number</label> 
                        <input type="text" placeholder="Enter Contact Number" class="w-full px-4 py-2.5 bg-neutral-50 border border-neutral-300 rounded-lg text-sm outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400" name="contact_number" id="contact_number" />
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-neutral-900 text-white text-sm font-bold py-3 rounded-lg hover:opacity-90 transition-all active:scale-[0.98] cursor-pointer">Save User</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock 'content' %}
