{% extends "layout/base.html" %}

{% block 'title' %} Add Gender Page {% endblock 'title' %}

{% block 'content' %}
{% include 'include/Sidebar.html' %}
{% include 'include/Toastmessage.html' %} 

<div class="w-full px-4 md:px-8 py-6"> 
    <div class="max-w-lg mx-auto bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
        
        <div class="px-6 py-4 border-b border-slate-100">
            <h2 class="text-lg font-bold text-slate-800">Add Gender</h2>
        </div>

        <div class="p-6">
            <form action="/gender/add" method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <input type="text" placeholder="Enter gender identity" class="w-full px-4 py-2.5 bg-neutral-50 dark:bg-neutral-700 border border-neutral-300 dark:border-neutral-700 rounded-lg text-sm transition-all outline-none focus:ring-4 focus:ring-inset focus:ring-black/5 dark:focus:ring-white/10 focus:border-neutral-400" name="gender" id="gender"/>
                </div>
                <button type="submit" class="w-full bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 text-sm font-bold py-3 rounded-lg hover:opacity-90 transition-all active:scale-[0.98] cursor-pointer">Save Gender</button>
            </form>
        </div>
    </div>
</div>

{% endblock 'content' %}
